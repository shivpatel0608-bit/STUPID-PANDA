<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Nebula Strike</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#03050f;color:#fff;font-family:system-ui,sans-serif;touch-action:none}
canvas{display:block;position:absolute;inset:0}
#hud{position:absolute;top:14px;left:14px;display:flex;gap:10px;z-index:5;pointer-events:none}
.box{padding:8px 12px;border:1px solid #ffffff20;border-radius:10px;background:#070a1dcc;backdrop-filter:blur(8px)}
.lbl{font-size:10px;letter-spacing:2px;color:#94a3b8;text-transform:uppercase}
.val{font-weight:900;font-size:18px;text-shadow:0 0 10px #fff5}
#healthWrap{width:140px;height:8px;background:#111827;border-radius:99px;margin-top:6px;overflow:hidden}
#healthBar{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3864,#ff9d4d,#76ff5a);transition:width .2s}
#overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(circle,#090e2bcc,#02030be8);backdrop-filter:blur(5px)}
#overlay.hide{display:none}
.card{width:min(640px,92vw);padding:30px;text-align:center;border:1px solid #ffffff20;border-radius:22px;background:linear-gradient(145deg,#0b1030e8,#050817ee);box-shadow:0 0 60px #8b5cf630}
h1{font-size:clamp(34px,7vw,64px);font-weight:1000;letter-spacing:6px;text-shadow:0 0 8px #39f7ff,0 0 30px #39f7ff88}
.sub{color:#a5b4fc;letter-spacing:4px;font-size:12px;margin:8px 0 22px}
p{color:#aab3ce;line-height:1.6;margin-bottom:22px}
button{font:inherit;color:#fff;border:1px solid #39f7ff88;background:linear-gradient(135deg,#0d4154,#1b1648);padding:14px 28px;border-radius:11px;font-weight:800;letter-spacing:.5px;cursor:pointer;box-shadow:0 0 28px #39f7ff2e}
button:hover{transform:translateY(-2px)}
#mobile{position:absolute;bottom:20px;left:0;right:0;display:none;justify-content:space-between;padding:0 20px;z-index:7}
.tbtn{width:70px;height:60px;border-radius:16px;font-size:22px;background:#070a1dcc;border:1px solid #39f7ff45}
@media(max-width:700px){#mobile{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="box"><div class="lbl">Score</div><div class="val" id="score">0</div></div>
  <div class="box"><div class="lbl">Level</div><div class="val" id="level">1</div></div>
  <div class="box"><div class="lbl">Hull</div><div id="healthWrap"><i id="healthBar"></i></div></div>
</div>
<div id="overlay">
  <div class="card" id="startCard">
    <h1>NEBULA STRIKE</h1>
    <div class="sub">DEEP-SPACE ARCADE</div>
    <p>Destroy enemy ships. Dodge their fire. Survive as long as you can.<br><b>← / →</b> or <b>A / D</b> to move &nbsp;•&nbsp; <b>SPACE</b> to fire</p>
    <button id="startBtn">▶ LAUNCH MISSION</button>
  </div>
  <div class="card" id="overCard" style="display:none">
    <h1 style="color:#ff4d7e;text-shadow:0 0 25px #ff3864">GAME OVER</h1>
    <div class="sub">FINAL SCORE</div>
    <div style="font-size:52px;font-weight:1000;margin:8px 0 20px;text-shadow:0 0 24px #39f7ff" id="finalScore">0</div>
    <button id="againBtn">↻ PLAY AGAIN</button>
  </div>
</div>
<div id="mobile">
  <div style="display:flex;gap:12px">
    <button class="tbtn" id="leftBtn">◀</button>
    <button class="tbtn" id="rightBtn">▶</button>
  </div>
  <button class="tbtn" id="fireBtn">✦</button>
</div>

<script>
(function(){
"use strict";

var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");
var scoreEl=document.getElementById("score");
var levelEl=document.getElementById("level");
var healthBar=document.getElementById("healthBar");
var overlay=document.getElementById("overlay");
var startCard=document.getElementById("startCard");
var overCard=document.getElementById("overCard");
var finalScoreEl=document.getElementById("finalScore");

var W,H,dpr;
var running=false,paused=false,last=0;
var score=0,level=1,health=100,spawnTimer=0,elapsed=0,shake=0;
var bullets=[],enemies=[],enemyBullets=[],particles=[],stars=[],powerups=[];
var keys={left:false,right:false};
var shootHeld=false,cool=0,inv=0;

var player={x:0,y:0,w:38,h:46,speed:420};

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  player.y=H-90;
  if(player.x<27)player.x=W/2;
}

function initStars(){
  stars=[];
  for(var i=0;i<260;i++){
    stars.push({
      x:Math.random()*W,y:Math.random()*H,
      r:Math.random()*1.8+0.3,
      s:Math.random()*70+20,
      a:Math.random()*0.8+0.2
    });
  }
}

function start(){
  score=0;level=1;health=100;spawnTimer=0;elapsed=0;shake=0;
  bullets=[];enemies=[];enemyBullets=[];particles=[];powerups=[];
  cool=0;inv=0;shootHeld=false;
  player.x=W/2;player.y=H-90;
  running=true;paused=false;levelComplete=false;
  startCard.style.display="none";
  overCard.style.display="none";
  overlay.classList.add("hide");
  updateHUD();
  last=performance.now();
  requestAnimationFrame(loop);
}

var levelComplete=false;

function endGame(){
  running=false;
  finalScoreEl.textContent=score.toLocaleString();
  overCard.style.display="block";
  overlay.classList.remove("hide");
}

function updateHUD(){
  scoreEl.textContent=score.toLocaleString();
  levelEl.textContent=level;
  healthBar.style.width=Math.max(0,health)+"%";
}

function spawnEnemy(){
  var r=Math.random();
  var type=r<0.6?"scout":(r<0.85?"zigzag":"tank");
  var cfg={
    scout:{w:30,h:28,hp:1,speed:110+level*8,color:"#ff2d55",fireRate:1.1},
    zigzag:{w:28,h:26,hp:2,speed:130+level*8,color:"#c264ff",fireRate:0.9},
    tank:{w:46,h:40,hp:4+Math.floor(level/3),speed:75+level*5,color:"#ff2ec4",fireRate:0.7}
  }[type];
  enemies.push({
    type:type,x:30+Math.random()*(W-60),y:-60,
    w:cfg.w,h:cfg.h,hp:cfg.hp,maxHp:cfg.hp,
    speed:cfg.speed,color:cfg.color,
    fireRate:cfg.fireRate*(0.8+Math.random()*0.5),
    fireCooldown:Math.random()*1.5,
    phase:Math.random()*7,baseX:0,rot:0
  });
}

function shoot(){
  if(!running||paused||cool>0)return;
  cool=0.18;
  bullets.push({x:player.x,y:player.y-24,v:760,w:4,h:16});
}

function enemyShoot(e){
  var dx=player.x-e.x,dy=player.y-e.y;
  var d=Math.sqrt(dx*dx+dy*dy)||1;
  var sp=230+level*12;
  enemyBullets.push({
    x:e.x,y:e.y+10,
    vx:(dx/d)*sp,vy:(dy/d)*sp,
    w:7,h:14,color:e.color,life:3
  });
}

function boom(x,y,color,n){
  n=n||20;
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,s=Math.random()*220+40;
    particles.push({
      x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:0.5+Math.random()*0.5,max:1,
      r:Math.random()*3+1,color:color
    });
  }
  shake=Math.min(10,shake+3);
}

function hitPlayer(dmg){
  if(inv>0)return;
  health-=dmg;inv=0.8;shake=8;
  if(health<=0){health=0;endGame();}
  updateHUD();
}

function rectHit(a,b){
  return Math.abs(a.x-b.x)<(a.w+b.w)/2 && Math.abs(a.y-b.y)<(a.h+b.h)/2;
}

function update(dt){
  elapsed+=dt;
  var move=(keys.left?-1:0)+(keys.right?1:0);
  player.x+=move*player.speed*dt;
  if(player.x<27)player.x=27;
  if(player.x>W-27)player.x=W-27;
  if(cool>0)cool-=dt;
  if(inv>0)inv-=dt;
  if(shootHeld)shoot();

  if(levelComplete)return;

  // spawn
  var every=Math.max(0.25,0.9-level*0.06);
  spawnTimer+=dt;
  if(spawnTimer>=every){spawnTimer=0;spawnEnemy();}

  // player bullets
  for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i];
    b.y-=b.v*dt;
    if(b.y<-30){bullets.splice(i,1);continue;}
    for(var j=enemies.length-1;j>=0;j--){
      var e=enemies[j];
      if(rectHit(b,e)){
        e.hp--;
        boom(b.x,b.y,e.color,5);
        bullets.splice(i,1);
        if(e.hp<=0){
          score+=e.maxHp*40+40;
          boom(e.x,e.y,e.color,25);
          enemies.splice(j,1);
          updateHUD();
        }
        break;
      }
    }
  }

  // enemy bullets
  for(var i=enemyBullets.length-1;i>=0;i--){
    var eb=enemyBullets[i];
    eb.x+=eb.vx*dt;eb.y+=eb.vy*dt;eb.life-=dt;
    if(rectHit({x:player.x,y:player.y,w:30,h:36},eb)){
      hitPlayer(12);
      boom(eb.x,eb.y,eb.color,6);
      enemyBullets.splice(i,1);
      continue;
    }
    if(eb.life<=0||eb.y<-80||eb.y>H+80||eb.x<-80||eb.x>W+80){
      enemyBullets.splice(i,1);
    }
  }

  // enemies
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    e.y+=e.speed*dt;e.rot+=dt;
    if(e.type==="zigzag"){
      if(!e.baseX)e.baseX=e.x;
      e.x=e.baseX+Math.sin(elapsed*3+e.phase)*55;
    }
    e.fireCooldown-=dt;
    if(e.fireCooldown<=0){
      e.fireCooldown=e.fireRate;
      if(e.y>10&&e.y<H*0.85&&Math.abs(e.x-player.x)<500){
        enemyShoot(e);
      }
    }
    if(rectHit({x:player.x,y:player.y,w:30,h:36},e)){
      boom(e.x,e.y,e.color,20);
      enemies.splice(i,1);
      hitPlayer(18);
      continue;
    }
    if(e.y>H+50){
      enemies.splice(i,1);
      hitPlayer(e.type==="tank"?25:12);
    }
  }

  // particles
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=80*dt;p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }

  // stars
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    s.y+=s.s*dt;
    if(s.y>H){s.y=-3;s.x=Math.random()*W;}
  }

  // level up
  var target=level*1000;
  if(score>=target){
    level++;
    health=Math.min(100,health+25);
    updateHUD();
    levelComplete=true;
    setTimeout(function(){
      levelComplete=false;
      last=performance.now();
      requestAnimationFrame(loop);
    },600);
    return;
  }

  shake*=0.88;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0.2){
    ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  }

  // nebula glow
  var g=ctx.createRadialGradient(W*0.5,H*0.35,0,W*0.5,H*0.35,Math.max(W,H)*0.6);
  g.addColorStop(0,"rgba(80,60,200,0.10)");
  g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  // stars
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    ctx.globalAlpha=s.a;
    ctx.fillStyle="#dbeafe";
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  // player bullets
  for(var i=0;i<bullets.length;i++){
    var b=bullets[i];
    ctx.save();
    ctx.shadowBlur=16;
    ctx.shadowColor="#39f7ff";
    ctx.fillStyle="#dfffff";
    ctx.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);
    ctx.restore();
  }

  // enemy bullets
  for(var i=0;i<enemyBullets.length;i++){
    var eb=enemyBullets[i];
    ctx.save();
    ctx.shadowBlur=14;
    ctx.shadowColor=eb.color;
    ctx.fillStyle=eb.color;
    ctx.beginPath();
    ctx.ellipse(eb.x,eb.y,eb.w/2,eb.h/2,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // enemies
  for(var i=0;i<enemies.length;i++){
    drawEnemy(enemies[i]);
  }

  // player
  drawPlayer();

  // particles
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.shadowBlur=10;
    ctx.shadowColor=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
  ctx.restore();
}

function drawPlayer(){
  if(inv>0&&Math.floor(inv*10)%2===0)ctx.globalAlpha=0.4;
  ctx.save();
  ctx.translate(player.x,player.y);

  // engine flare
  var fl=20+Math.random()*10;
  var eg=ctx.createLinearGradient(0,15,0,15+fl);
  eg.addColorStop(0,"#39f7ff");
  eg.addColorStop(1,"transparent");
  ctx.fillStyle=eg;
  ctx.shadowBlur=20;
  ctx.shadowColor="#39f7ff";
  ctx.beginPath();
  ctx.moveTo(-8,15);ctx.lineTo(0,15+fl);ctx.lineTo(8,15);ctx.closePath();
  ctx.fill();

  // hull
  ctx.shadowBlur=18;
  ctx.shadowColor="#39f7ff";
  var hg=ctx.createLinearGradient(0,-26,0,20);
  hg.addColorStop(0,"#eafcff");
  hg.addColorStop(0.5,"#39f7ff");
  hg.addColorStop(1,"#0d6b78");
  ctx.fillStyle=hg;
  ctx.beginPath();
  ctx.moveTo(0,-26);
  ctx.lineTo(18,17);
  ctx.lineTo(7,13);
  ctx.lineTo(0,20);
  ctx.lineTo(-7,13);
  ctx.lineTo(-18,17);
  ctx.closePath();
  ctx.fill();
  ctx.lineWidth=1.5;
  ctx.strokeStyle="rgba(255,255,255,0.7)";
  ctx.stroke();

  // cockpit
  ctx.shadowBlur=12;
  ctx.shadowColor="#c4b5fd";
  var cg=ctx.createRadialGradient(0,-8,0,0,-8,5);
  cg.addColorStop(0,"#ffffff");
  cg.addColorStop(0.6,"#c4b5fd");
  cg.addColorStop(1,"#8b5cf6");
  ctx.fillStyle=cg;
  ctx.beginPath();
  ctx.arc(0,-9,4,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
}

function drawEnemy(e){
  ctx.save();
  ctx.translate(e.x,e.y);
  ctx.shadowBlur=18;
  ctx.shadowColor=e.color;
  ctx.beginPath();
  if(e.type==="tank"){
    ctx.moveTo(0,-20);ctx.lineTo(22,-7);ctx.lineTo(16,16);
    ctx.lineTo(0,22);ctx.lineTo(-16,16);ctx.lineTo(-22,-7);
  }else if(e.type==="zigzag"){
    ctx.moveTo(0,-16);ctx.lineTo(17,0);ctx.lineTo(0,16);ctx.lineTo(-17,0);
  }else{
    ctx.moveTo(0,-14);ctx.lineTo(14,9);ctx.lineTo(5,7);
    ctx.lineTo(0,15);ctx.lineTo(-5,7);ctx.lineTo(-14,9);
  }
  ctx.closePath();
  ctx.lineWidth=3;
  ctx.strokeStyle="#050815";
  ctx.stroke();
  var fg=ctx.createLinearGradient(0,-e.h/2,0,e.h/2);
  fg.addColorStop(0,e.color);
  fg.addColorStop(1,e.color+"44");
  ctx.fillStyle=fg;
  ctx.fill();
  ctx.lineWidth=1.5;
  ctx.strokeStyle="rgba(255,255,255,0.6)";
  ctx.stroke();

  // core
  ctx.shadowBlur=12;
  ctx.shadowColor="#fff";
  ctx.fillStyle="#fff";
  ctx.globalAlpha=0.9;
  ctx.beginPath();
  ctx.arc(0,0,e.type==="tank"?4:3,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;

  // hp bar
  if(e.maxHp>1){
    ctx.shadowBlur=0;
    ctx.fillStyle="#050815";
    ctx.fillRect(-e.w/2-1,-e.h/2-8,e.w+2,4);
    ctx.fillStyle=e.color;
    ctx.fillRect(-e.w/2,-e.h/2-7,e.w*(e.hp/e.maxHp),2);
  }
  ctx.restore();
}

function loop(now){
  if(!running||paused)return;
  var dt=Math.min(0.033,(now-last)/1000);
  last=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// input
window.addEventListener("keydown",function(e){
  if(e.code==="ArrowLeft"||e.code==="KeyA")keys.left=true;
  if(e.code==="ArrowRight"||e.code==="KeyD")keys.right=true;
  if(e.code==="Space"){e.preventDefault();shootHeld=true;shoot();}
});
window.addEventListener("keyup",function(e){
  if(e.code==="ArrowLeft"||e.code==="KeyA")keys.left=false;
  if(e.code==="ArrowRight"||e.code==="KeyD")keys.right=false;
  if(e.code==="Space")shootHeld=false;
});

document.getElementById("startBtn").onclick=start;
document.getElementById("againBtn").onclick=start;

// touch
function bind(id,key){
  var el=document.getElementById(id);
  el.addEventListener("touchstart",function(e){e.preventDefault();keys[key]=true;},{passive:false});
  el.addEventListener("touchend",function(e){e.preventDefault();keys[key]=false;},{passive:false});
}
bind("leftBtn","left");
bind("rightBtn","right");
var fb=document.getElementById("fireBtn");
fb.addEventListener("touchstart",function(e){e.preventDefault();shootHeld=true;shoot();},{passive:false});
fb.addEventListener("touchend",function(e){e.preventDefault();shootHeld=false;},{passive:false});

window.addEventListener("resize",function(){resize();initStars();});

resize();
initStars();
draw();
})();
</script>
</body>
</html>
